header h1{font-size:17px;margin:0;flex:1}header .s{font-size:13px;opacity:.85}header button{background:none;border:0;color:#fff;font-size:22px;padding:0 6px}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.card{background:#fff;border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}.mut{color:var(--m);font-size:14px}
button,.btn{font:inherit;min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--b);background:#fff;color:var(--b);cursor:pointer}
button.p{background:var(--b);color:#fff}button.d{border-color:var(--nc);color:var(--nc)}button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1 1 auto}
label{display:block;font-size:14px;color:var(--m);margin:10px 0 3px}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #b9c0c7;border-radius:8px;background:#fff}textarea{min-height:70px}
.chk{display:flex;gap:10px;align-items:center;color:var(--t);font-size:16px}.chk input{width:22px;height:22px}
.bar{height:8px;background:var(--l);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.st{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.st button{min-height:50px;font-weight:600}
.st button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}.st button.nc.on{background:var(--nc);border-color:var(--nc);color:#fff}
.st button.na.on{background:var(--na);border-color:var(--na);color:#fff}.st button.nv.on{background:var(--nv);border-color:var(--nv);color:#fff}
.st button.ok{color:var(--ok);border-color:var(--ok)}.st button.nc{color:var(--nc);border-color:var(--nc)}.st button.na{color:var(--na);border-color:var(--na)}.st button.nv{color:var(--nv);border-color:var(--nv)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}.tag.ok{background:var(--ok)}.tag.nc{background:var(--nc)}.tag.na{background:var(--na)}.tag.nv{background:var(--nv)}.tag.pe{background:#9aa3ab}
.it{border-left:4px solid var(--l)}.it.ok{border-color:var(--ok)}.it.nc{border-color:var(--nc)}.it.na{border-color:var(--na)}.it.nv{border-color:var(--nv)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph div{position:relative}.ph img{width:84px;height:84px;object-fit:cover;border-radius:6px}.ph b{position:absolute;top:-6px;right:-6px;background:var(--nc);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:14px}
.sub{background:#fbf3f2;border:1px solid #efc9c4;border-radius:8px;padding:10px;margin-top:10px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.ctr b{display:block;font-size:22px}
/* impressão do relatório */
@media print{header,#toast,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#bbb}main{max-width:none;padding:0}}

<script>/* Utilitários, constantes e estado global da aplicação. */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={CONFORME:['Conforme','ok'],NAO_CONFORME:['Não conforme','nc'],NAO_SE_APLICA:['Não se aplica','na'],NAO_VERIFICADO:['Não verificado','nv']};
const NV=['Ausência de fornecimento de água','Ausência de energia elétrica','Acesso impedido','Equipamento não instalado ou indisponível','Teste não autorizado','Condição insegura','Outro'];
const PRI=['Baixa','Média','Alta','Crítica'];
let CAT,props=[],insps=[],cur,S={v:'home'},urls={},T;

/* Camada IndexedDB (imóveis, vistorias e fotos) e salvamento automático. */
// ---- IndexedDB (dados e fotos; nada em localStorage) ----
const DB=(()=>{let d;const o=()=>d||(d=new Promise((ok,er)=>{const r=indexedDB.open('vistoria',1);r.onupgradeneeded=()=>['props','insps','photos'].forEach(s=>r.result.createObjectStore(s,{keyPath:'id'}));r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}));
const t=async(s,m,f)=>{const db=await o();return new Promise((ok,er)=>{const x=db.transaction(s,m),q=f(x.objectStore(s));x.oncomplete=()=>ok(q&&q.result);x.onerror=()=>er(x.error)})};
return{all:s=>t(s,'readonly',x=>x.getAll()),put:(s,v)=>t(s,'readwrite',x=>x.put(v)),del:(s,k)=>t(s,'readwrite',x=>x.delete(k))}})();
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)};
const save=()=>{clearTimeout(T);T=setTimeout(()=>DB.put('insps',cur).then(()=>toast('Salvo ✓')),250)};
const uid=()=>crypto.randomUUID();

/* Regras da vistoria: aplicabilidade sugerida, contagens de progresso e carregamento de dados/catálogo. */
// ---- aplicabilidade SUGERIDA (a validar pelo engenheiro) ----
const naReason=(n,c)=>(n>=65&&n<=72&&!c.box&&'Unidade sem box/divisória')||(n>=99&&n<=101&&!c.exaustor&&'Unidade sem exaustor')||(n>=83&&n<=89&&c.chuveiro=='Não instalado'&&'Chuveiro não instalado')||(n==96&&c.chuveiro!='Elétrico'&&'Chuveiro não é elétrico')||'';
const cnt=i=>{const c={CONFORME:0,NAO_CONFORME:0,NAO_SE_APLICA:0,NAO_VERIFICADO:0,pe:0};i.items.forEach(x=>x.st?c[x.st]++:c.pe++);c.n=i.items.length;c.pct=Math.round((c.n-c.pe)/c.n*100);return c};
const tag=s=>s?`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`:'<span class="tag pe">Pendente</span>';
const pn=id=>props.find(p=>p.id==id)||{name:'(imóvel removido)'};
const fld=(l,k,v,t='text')=>`<label>${l}</label><input type="${t}" data-p="${k}" value="${esc(v)}">`;
async function load(){[props,insps]=await Promise.all([DB.all('props'),DB.all('insps')]);insps.sort((a,b)=>b.startedAt.localeCompare(a.startedAt))}
async function loadCat(){CAT=JSON.parse(document.getElementById('catalogo').textContent)}

/* Telas (HTML gerado por funções). */
// ---- telas ----
const V={
home(){return`<div class="row"><button class="p" data-a="newp">+ Cadastrar imóvel</button></div>
<h2>Imóveis</h2>${props.map(p=>`<div class="card"><h3>${esc(p.name||'Sem nome')} ${esc(p.unit)}</h3><div class="mut">${esc(p.developer)} ${esc(p.tower)} · ${esc(p.client)}</div>
<div class="row"><button class="p" data-a="start" data-x="${p.id}">Iniciar vistoria</button><button data-a="editp" data-x="${p.id}">Editar</button></div></div>`).join('')||'<p class="mut">Nenhum imóvel. Cadastre o primeiro.</p>'}
<h2>Vistorias</h2>${insps.map(i=>{const c=cnt(i);return`<div class="card"><h3>${esc(pn(i.pid).name)} ${esc(pn(i.pid).unit)}</h3><div class="mut">${i.status.replace('_',' ').toLowerCase()} · ${c.pct}% · ${new Date(i.startedAt).toLocaleDateString('pt-BR')}</div><div class="bar"><i style="width:${c.pct}%"></i></div>
<div class="row"><button class="p" data-a="open" data-x="${i.id}">Abrir</button><button data-a="rel" data-x="${i.id}">Relatório</button></div></div>`}).join('')||'<p class="mut">Nenhuma vistoria iniciada.</p>'}
<h2>Backup</h2><div class="row"><button data-a="exp">Exportar backup</button><button onclick="$('#imp').click()">Importar backup</button></div><input id="imp" type="file" accept=".json" hidden>
<p class="mut">Os dados ficam neste navegador. Exporte o backup com frequência.</p>`},
prop(){const p=S.p;return`<div class="card">${fld('Identificação / nome do empreendimento','name',p.name)}${fld('Construtora/incorporadora','developer',p.developer)}${fld('Endereço','address',p.address)}${fld('Unidade','unit',p.unit)}${fld('Torre/bloco','tower',p.tower)}${fld('Cliente/proprietário','client',p.client)}${fld('Data prevista','date',p.date,'date')}<label>Observações</label><textarea data-p="notes">${esc(p.notes)}</textarea>
<div class="row"><button class="p" data-a="savep">Salvar</button>${props.some(x=>x.id==p.id)?'<button class="d" data-a="delp">Excluir</button>':''}</div></div>`},
start(){return`<div class="card"><h3>${esc(pn(S.pid).name)} ${esc(pn(S.pid).unit)}</h3>${fld('Responsável pela inspeção','insp','')}
<label>Configuração do banheiro</label><label class="chk"><input type="checkbox" id="c_box" checked>Possui box/divisória</label><label class="chk"><input type="checkbox" id="c_ex" checked>Possui exaustor</label>
<label>Tipo de chuveiro</label><select id="c_ch"><option>Elétrico</option><option>Aquecimento central/gás</option><option>Outro</option><option>Não instalado</option></select>
<p class="mut">Critérios que não se aplicam entram como "Não se aplica" com justificativa (regras sugeridas, a validar).</p><div class="row"><button class="p" data-a="go">Iniciar vistoria</button></div></div>`},
insp(){const c=cnt(cur);return`<div class="card"><div class="ctr"><div><b>${c.CONFORME}</b>conformes</div><div><b>${c.NAO_CONFORME}</b>não conf.</div><div><b>${c.NAO_SE_APLICA}</b>não aplica</div><div><b>${c.NAO_VERIFICADO}</b>não verif.</div><div><b>${c.pe}</b>pendentes</div><div><b>${c.pct}%</b>concluído</div></div><div class="bar"><i style="width:${c.pct}%"></i></div></div>
${CAT.categories.map(g=>{const it=cur.items.filter(x=>x.cat==g.id),d=it.filter(x=>x.st).length;return`<div class="card" data-a="cat" data-x="${g.id}" style="cursor:pointer"><h3>${esc(g.name)}</h3><span class="mut">${d}/${it.length} avaliados</span><div class="bar"><i style="width:${d/it.length*100}%"></i></div></div>`}).join('')}
<div class="row"><button data-a="pause">${cur.status=='PAUSADA'?'Retomar':'Pausar'}</button><button data-a="rel" data-x="${cur.id}">Relatório</button><button class="p" data-a="fin" ${c.pe?'disabled':''}>Finalizar${c.pe?' (há pendentes)':''}</button></div>`},
cat(){return CAT.criteria.filter(c=>c.category_id==S.c).map(c=>{const i=cur.items.findIndex(x=>x.id==c.id),x=cur.items[i];return item(x,i)}).join('')},
rel(){const i=cur,c=cnt(i),p=pn(i.pid),sec=(t,f)=>{const l=i.items.filter(f);return l.length?`<h3>${t} (${l.length})</h3>`+l.map(x=>`<div class="card"><b>${x.id}</b> ${esc(x.d)}<br><span class="mut">${esc(x.catName)}</span><br>${tag(x.st)}${x.na?` <span class="mut">${esc(x.na)}</span>`:''}${x.nv?` <span class="mut">Motivo: ${esc(x.nv)}</span>`:''}${x.note?`<br>Obs.: ${esc(x.note)}`:''}${x.nc?`<br>Ocorrência: ${esc(x.nc.desc)}<br>Local: ${esc(x.nc.loc)} · Prioridade: ${esc(x.nc.pri)}<br>Recomendação: ${esc(x.nc.rec)}<br>${esc(x.nc.obs)}`:''}<div class="ph">${x.ph.map(f=>`<img src="${urls[f]}">`).join('')}</div></div>`).join(''):''};
return`<div class="row noprint"><button class="p" data-a="print">Imprimir / salvar PDF</button></div><div class="card"><h2>Relatório de vistoria — Banheiro</h2>Imóvel: ${esc(p.name)} ${esc(p.unit)} ${esc(p.tower)}<br>Empreendimento/construtora: ${esc(p.developer)}<br>Endereço: ${esc(p.address)}<br>Cliente: ${esc(p.client)}<br>Data: ${new Date(i.startedAt).toLocaleDateString('pt-BR')} · Responsável: ${esc(i.insp)}<br>Catálogo ${esc(i.cat.id)} v${esc(i.cat.version)} (${esc(i.cat.status)})</div>
<div class="card"><h3>Resumo</h3>Avaliados: ${c.n-c.pe} de ${c.n} · Conformes: ${c.CONFORME} · Não conformes: ${c.NAO_CONFORME} · Não se aplica: ${c.NAO_SE_APLICA} · Não verificados: ${c.NAO_VERIFICADO} · Pendentes: ${c.pe}</div>
${sec('Não conformidades',x=>x.st=='NAO_CONFORME')}${sec('Itens não verificados (limitações da inspeção)',x=>x.st=='NAO_VERIFICADO')}${sec('Conformes com observação',x=>x.st=='CONFORME'&&x.note)}
<div class="card"><h3>Observações gerais e limitações</h3><textarea data-g="notes">${esc(i.notes||'')}</textarea><p class="mut">Inspeção visual, funcional e documental não destrutiva; não substitui ensaios técnicos específicos. As referências normativas do catálogo estão pendentes de validação e não foram aplicadas como critério de conformidade.</p><br><br>______________________________<br>${esc(i.insp)} — Responsável técnico</div>`}};
function item(x,i){const s=x.st?ST[x.st][1]:'';return`<div class="card it ${s}"><b>${x.id}</b> ${esc(x.d)}<div class="mut">${esc(x.tipo)}${x.inst?' · '+esc(x.inst):''}</div>${x.na&&x.st=='NAO_SE_APLICA'&&x.auto?`<div class="mut">Justificativa automática: ${esc(x.na)}</div>`:''}
<div class="st">${Object.entries(ST).map(([k,v])=>`<button class="${v[1]} ${x.st==k?'on':''}" data-a="st" data-i="${i}" data-x="${k}">${v[0]}</button>`).join('')}</div>
${x.st=='NAO_VERIFICADO'?`<label>Motivo</label><select data-i="${i}" data-k="nv"><option value="">Selecione…</option>${NV.map(n=>`<option ${x.nv==n?'selected':''}>${n}</option>`).join('')}</select>`:''}
${x.st=='NAO_CONFORME'?`<div class="sub"><label>Descrição da ocorrência</label><textarea data-i="${i}" data-k="nc.desc">${esc(x.nc.desc)}</textarea><label>Localização exata</label><input data-i="${i}" data-k="nc.loc" value="${esc(x.nc.loc)}"><label>Prioridade</label><select data-i="${i}" data-k="nc.pri">${PRI.map(n=>`<option ${x.nc.pri==n?'selected':''}>${n}</option>`).join('')}</select><label>Recomendação técnica</label><textarea data-i="${i}" data-k="nc.rec">${esc(x.nc.rec)}</textarea><label>Observações adicionais</label><textarea data-i="${i}" data-k="nc.obs">${esc(x.nc.obs)}</textarea></div>`:''}
<label>Observações</label><textarea data-i="${i}" data-k="note">${esc(x.note)}</textarea>
<div class="ph">${x.ph.map(f=>`<div><img src="${urls[f]||''}"><b data-a="delph" data-i="${i}" data-x="${f}">×</b></div>`).join('')}</div>
<div class="row"><label class="btn" style="text-align:center;line-height:46px;margin:0">📷 Foto<input type="file" accept="image/*" capture="environment" hidden data-ph="${i}"></label></div></div>`}

/* Navegação, eventos, fotos, backup e inicialização. */
// ---- render / navegação ----
const TT={home:'Vistoria Técnica',prop:'Imóvel',start:'Nova vistoria',insp:'Vistoria',cat:'Critérios',rel:'Relatório'};
async function render(){const y=scrollY;$('#ttl').textContent=S.v=='cat'?CAT.categories.find(g=>g.id==S.c).name:TT[S.v];$('#back').style.visibility=S.v=='home'?'hidden':'visible';
  if(cur&&(S.v=='cat'||S.v=='rel'))for(const p of await DB.all('photos'))if(p.ins==cur.id&&!urls[p.id])urls[p.id]=URL.createObjectURL(p.blob);
  $('#app').innerHTML=V[S.v]();scrollTo(0,y)}
const go=(v,o={})=>{S={v,...o};render();scrollTo(0,0)};
$('#back').onclick=()=>S.v=='cat'||S.v=='rel'&&cur&&S.from=='insp'?go('insp'):S.v=='rel'&&!S.from?go('home'):go(S.v=='cat'?'insp':'home');
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.8)};i.src=URL.createObjectURL(f)});
async function onClick(e){const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,x=t.dataset.x,i=t.dataset.i;
 if(a=='newp')go('prop',{p:{id:uid(),name:'',developer:'',address:'',unit:'',tower:'',client:'',date:'',notes:''}});
 if(a=='editp')go('prop',{p:{...props.find(p=>p.id==x)}});
 if(a=='savep'){if(!(S.p.name||'').trim())return alert('Informe o nome do empreendimento.');await DB.put('props',S.p);await load();go('home');toast('Imóvel cadastrado ✓')}
 if(a=='delp'){if(insps.some(v=>v.pid==S.p.id))return alert('Este imóvel possui vistorias e não pode ser excluído.');if(confirm('Excluir imóvel?')){await DB.del('props',S.p.id);await load();go('home')}}
 if(a=='start')go('start',{pid:x});
 if(a=='go'){if(!CAT)await loadCat();const c={box:$('#c_box').checked,exaustor:$('#c_ex').checked,chuveiro:$('#c_ch').value},m=CAT.metadata;
  cur={id:uid(),pid:S.pid,status:'EM_ANDAMENTO',insp:$('[data-p=insp]').value,startedAt:new Date().toISOString(),notes:'',cfg:c,cat:{id:m.catalog_id,version:m.version,status:m.status},refs:CAT.reference_library,
  items:CAT.criteria.filter(k=>k.active).map(k=>{const n=+k.id.slice(4),r=naReason(n,c);return{id:k.id,cat:k.category_id,catName:k.category,d:k.description,tipo:k.inspection_type,inst:k.recommended_instrument=='—'?'':k.recommended_instrument,origin:k.origin,st:r?'NAO_SE_APLICA':null,auto:!!r,na:r,note:'',nv:'',nc:null,ph:[]}})};
  await DB.put('insps',cur);await load();go('insp');toast('Vistoria iniciada ✓')}
 if(a=='open'){cur=insps.find(v=>v.id==x);go('insp')}
 if(a=='cat')go('cat',{c:x});
 if(a=='st'){const it=cur.items[i];it.st=x;it.auto=false;if(x=='NAO_CONFORME'&&!it.nc)it.nc={desc:'',loc:'',pri:'Média',rec:'',obs:''};it.at=new Date().toISOString();save();render()}
 if(a=='delph'){const it=cur.items[i];it.ph=it.ph.filter(f=>f!=x);await DB.del('photos',x);save();render()}
 if(a=='pause'){cur.status=cur.status=='PAUSADA'?'EM_ANDAMENTO':'PAUSADA';save();render()}
 if(a=='fin'&&confirm('Finalizar a vistoria?')){cur.status='CONCLUIDA';cur.finishedAt=new Date().toISOString();await DB.put('insps',cur);await load();go('home')}
 if(a=='rel'){cur=insps.find(v=>v.id==x)||cur;go('rel',{from:S.v=='insp'?'insp':''})}
 if(a=='print')print();
 if(a=='exp'){const ph=await DB.all('photos');for(const p of ph){p.data=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(p.blob)});delete p.blob}
  const b=new Blob([JSON.stringify({props,insps,photos:ph})],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='backup-vistoria-'+new Date().toISOString().slice(0,10)+'.json';l.click()}}
document.addEventListener('click',e=>onClick(e).catch(err=>alert('Erro: '+(err&&err.message||err))));
addEventListener('unhandledrejection',e=>alert('Erro: '+(e.reason&&e.reason.message||e.reason)));
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p!==undefined&&S.p)S.p[t.dataset.p]=t.value;
 if(t.dataset.g){cur.notes=t.value;save()}
 if(t.dataset.k){const it=cur.items[t.dataset.i],k=t.dataset.k;if(k.startsWith('nc.'))it.nc[k.slice(3)]=t.value;else it[k]=t.value;save()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.ph!==undefined&&t.files[0]){const b=await shrink(t.files[0]),id=uid();await DB.put('photos',{id,ins:cur.id,item:cur.items[t.dataset.ph].id,blob:b,at:new Date().toISOString()});urls[id]=URL.createObjectURL(b);cur.items[t.dataset.ph].ph.push(id);save();render()}
 if(t.id=='imp'&&t.files[0]){const d=JSON.parse(await t.files[0].text());if(!confirm('Importar backup? Registros com o mesmo ID serão substituídos.'))return;
  for(const p of d.props)await DB.put('props',p);for(const v of d.insps)await DB.put('insps',v);
  for(const p of d.photos){p.blob=await (await fetch(p.data)).blob();delete p.data;await DB.put('photos',p)}await load();go('home');toast('Backup importado')}});
const net=()=>$('#net').textContent=navigator.onLine?'online':'offline';addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{});
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
Promise.all([load(),loadCat()]).then(()=>go('home')).catch(e=>{$('#app').innerHTML='<div class="card">Não foi possível carregar o catálogo: '+esc(e.message)+'. Abra o app por um endereço http(s), não pelo arquivo local.</div>'});

</script></body></html>
