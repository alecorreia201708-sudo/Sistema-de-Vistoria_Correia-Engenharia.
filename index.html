<script>/* Utilitários, constantes e estado global da aplicação. */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NV=['Ausência de fornecimento de água','Ausência de energia elétrica','Acesso impedido','Equipamento não instalado ou indisponível','Teste não autorizado','Condição insegura','Outro'];
const PRI=['Baixa','Média','Alta','Crítica'];
let CAT,envs=[],props=[],insps=[],cur,S={v:'home'},urls={},T;

/* Regras puras (sem DOM): chave de item, aplicabilidade, validação de finalização e de backup.
   Podem ser testadas fora do navegador (ver tests/). */
const ikey=x=>(x.env||'')+'|'+x.id;
const known=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
// Campos de configuração de que cada critério do BANHEIRO depende. Valor desconhecido NUNCA é presumido.
const cfgNeeds=n=>n>=65&&n<=72?['box']:n>=99&&n<=101?['exaustor']:(n>=83&&n<=89)||n==96?['chuveiro']:[];
const CFG_LABEL={box:'box/divisória',exaustor:'exaustor',chuveiro:'tipo de chuveiro'};
const cfgOf=e=>({box:known(e.box)?e.box=='Sim':undefined,exaustor:known(e.exaustor)?e.exaustor=='Sim':undefined,chuveiro:known(e.chuveiro)?e.chuveiro:undefined});
const cfgMissing=(n,c)=>cfgNeeds(n).filter(f=>c[f]===undefined);
// Regras SUGERIDAS (a validar). Só disparam com informação explícita; sem informação, retornam ''.
const naReason=(n,c)=>(n>=65&&n<=72&&c.box===false&&'Unidade sem box/divisória')||(n>=99&&n<=101&&c.exaustor===false&&'Unidade sem exaustor')||(n>=83&&n<=89&&c.chuveiro=='Não instalado'&&'Chuveiro não instalado')||(n==96&&c.chuveiro!==undefined&&c.chuveiro!='Elétrico'&&'Chuveiro não é elétrico')||'';
const blank=s=>!String(s??'').trim();
const STATUS=['CONFORME','NAO_CONFORME','NAO_SE_APLICA','NAO_VERIFICADO'];
const itemLabel=x=>`${x.en?x.en+' › ':''}${x.id}`;
// Retorna {errors:[], warnings:[]}. errors impedem a finalização.
function validateInspection(ins){
  const errors=[],warnings=[];
  const add=(l,x,m)=>l.push(`${itemLabel(x)}: ${m}`);
  for(const x of ins.items||[]){
    if(!x.st){add(errors,x,'pendente de avaliação');continue}
    if(x.st=='NAO_CONFORME'){
      if(!x.nc||blank(x.nc.desc))add(errors,x,'não conforme sem descrição da ocorrência');
      if(!x.nc||blank(x.nc.loc))add(errors,x,'não conforme sem localização exata');
      if(!(x.ph||[]).length)add(warnings,x,'não conforme sem fotografia');
    }
    if(x.st=='NAO_VERIFICADO'){
      if(blank(x.nv))add(errors,x,'não verificado sem motivo');
      else if(x.nv=='Outro'&&blank(x.note))add(errors,x,'motivo "Outro" exige descrição em Observações');
    }
    if(x.st=='NAO_SE_APLICA'){
      if(blank(x.na))add(errors,x,'não se aplica sem justificativa');

}
const fmtList=(l,n=8)=>l.slice(0,n).map(s=>'• '+s).join('\n')+(l.length>n?`\n… e mais ${l.length-n}`:'');
// ---- backup ----
const BACKUP_APP='vistoria-correia',BACKUP_FORMAT=3;
const isObj=v=>v&&typeof v=='object'&&!Array.isArray(v);
// Identificadores aceitos: letras, números e . _ : - (nunca aspas, espaços, < > ou barras). Protege atributos HTML e chaves.
const SAFE_ID=/^[A-Za-z0-9._:-]{1,100}$/,okId=v=>typeof v=='string'&&SAFE_ID.test(v);
const sh=v=>{const t=String(v);return t.length>40?t.slice(0,40)+'…':t};
const strOpt=v=>v===undefined||v===null||typeof v=='string';
const IMG_RX=/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/]+={0,2}$/,MAX_IMG=15e6;
const PRI_OK=['Baixa','Média','Alta','Crítica'];
const FIELDS_P=['name','developer','address','unit','tower','client','date','notes'];
// assinatura "tamanho:hash"; algoritmos diferentes (sha256 x fallback) comparam só o tamanho
const fpEq=(a,b)=>{if(!a||!b)return false;const[x,hx='']=a.split(':'),[y,hy='']=b.split(':');return x===y&&(hx.startsWith('fnv')!==hy.startsWith('fnv')||hx===hy)};
// d: arquivo; local:{props,envs,insps,photoIds:Set,photoIns:Map}; fp:{backup:Map,local:Map} (assinaturas das imagens).
// Retorna {errors (bloqueiam), warnings (exigem confirmação), counts, legacy}
function validateBackup(d,local,fp){
  const errors=[],warnings=[];
  local=local||{};local.props=local.props||[];local.envs=local.envs||[];local.insps=local.insps||[];local.photoIds=local.photoIds||new Set();local.photoIns=local.photoIns||new Map();
  if(!isObj(d))return{errors:['O arquivo não é um backup válido (o conteúdo não é um objeto JSON).'],warnings,counts:{}};
  if(d.app!==undefined&&d.app!==BACKUP_APP)errors.push(`Arquivo de outro sistema ("${sh(d.app)}").`);
  if(d.formatVersion!==undefined&&!(Number.isInteger(d.formatVersion)&&d.formatVersion>=1&&d.formatVersion<=BACKUP_FORMAT))errors.push(`Versão de backup incompatível (${sh(d.formatVersion)}); a suportada é até ${BACKUP_FORMAT}.`);
  const legacy=d.formatVersion===undefined;if(legacy)warnings.push('Backup antigo (sem identificação de versão); validado apenas pelo conteúdo.');
  for(const k of ['props','insps','photos'])if(!Array.isArray(d[k]))errors.push(`Campo obrigatório ausente ou inválido: ${k}.`);
  if(d.envs!==undefined&&!Array.isArray(d.envs))errors.push('Campo "envs" inválido.');
  if(errors.length)return{errors,warnings,counts:{}};
  const envs=d.envs||[],ids={};
  const chk=(k,arr)=>{const st=new Set();arr.forEach((r,n)=>{if(!isObj(r))errors.push(`${k}[${n}]: registro inválido (não é objeto).`);else if(!okId(r.id))errors.push(`${k}[${n}]: identificador inválido ou ausente (${sh(r.id)}). Use apenas letras, números e . _ : -`);else if(st.has(r.id))errors.push(`${k}: identificador duplicado (${sh(r.id)}).`);else st.add(r.id)});ids[k]=st};
  chk('props',d.props);chk('envs',envs);chk('insps',d.insps);chk('photos',d.photos);
  if(errors.length)return{errors,warnings,counts:{}};
  if(isObj(d.counts)){const m={props:d.props.length,envs:envs.length,insps:d.insps.length,photos:d.photos.length};for(const k in m)if(d.counts[k]!==undefined&&d.counts[k]!==m[k])warnings.push(`Contagem declarada de ${k} (${sh(d.counts[k])}) difere do conteúdo (${m[k]}).`)}
  const allProps=new Set([...ids.props,...local.props.map(p=>p.id)]);
  for(const p of d.props)for(const f of FIELDS_P)if(!strOpt(p[f]))errors.push(`Imóvel ${sh(p.id)}: o campo "${f}" deve ser texto.`);
  for(const e of envs){if(!okId(e.pid))errors.push(`Ambiente ${sh(e.id)}: imóvel (pid) inválido ou ausente.`);else if(!allProps.has(e.pid))errors.push(`Ambiente ${sh(e.id)}: refere-se a imóvel inexistente (${sh(e.pid)}).`);
    if(typeof e.name!='string'||!e.name.trim())errors.push(`Ambiente ${sh(e.id)}: nome ausente.`);if(!strOpt(e.type))errors.push(`Ambiente ${sh(e.id)}: tipo inválido.`)}
  const phMap=new Map(d.photos.map(p=>[p.id,p])),refBy=new Map();
  for(const i of d.insps){
    const I=`Vistoria ${sh(i.id)}`;
    if(!Array.isArray(i.items)){errors.push(`${I}: lista de critérios ausente.`);continue}
    if(!['EM_ANDAMENTO','PAUSADA','CONCLUIDA'].includes(i.status))errors.push(`${I}: situação inválida (${sh(i.status)}).`);
    if(typeof i.startedAt!='string'||isNaN(Date.parse(i.startedAt)))errors.push(`${I}: data de início inválida.`);
    if(i.status=='CONCLUIDA'&&(typeof i.finishedAt!='string'||isNaN(Date.parse(i.finishedAt))))warnings.push(`${I}: concluída sem data de conclusão válida.`);
    if(i.pid!==undefined&&!okId(i.pid))errors.push(`${I}: identificador de imóvel inválido (${sh(i.pid)}).`);
    else if(!allProps.has(i.pid)){if(isObj(i.prop))warnings.push(`${I}: imóvel não encontrado; será usado o registro do imóvel gravado na vistoria.`);else errors.push(`${I}: refere-se a imóvel inexistente (${sh(i.pid)}).`)}
    for(const f of ['insp','notes','limitations'])if(!strOpt(i[f]))errors.push(`${I}: o campo "${f}" deve ser texto.`);
    if(i.rev!==undefined&&!(Number.isInteger(i.rev)&&i.rev>=0))errors.push(`${I}: número de revisão inválido.`);
    let envSet=null;
    if(i.envs!==undefined){if(!Array.isArray(i.envs))errors.push(`${I}: lista de ambientes inválida.`);else{envSet=new Set();for(const e of i.envs){if(!isObj(e)||!okId(e.id))errors.push(`${I}: ambiente com identificador inválido (${sh(e&&e.id)}).`);else envSet.add(e.id)}}}
    const seen=new Set();
    for(const x of i.items){
      if(!isObj(x)){errors.push(`${I}: critério inválido (não é objeto).`);continue}
      if(!okId(x.id)){errors.push(`${I}: critério com código inválido ou ausente (${sh(x.id)}).`);continue}
      const X=`${I}, ${x.id}`;
      if(x.env!==undefined&&x.env!==''&&!okId(x.env))errors.push(`${X}: identificador de ambiente inválido (${sh(x.env)}).`);
      else if(envSet&&x.env&&!envSet.has(x.env))errors.push(`${X}: critério de ambiente inexistente na vistoria (${sh(x.env)}).`);
      if(x.cat!==undefined&&!okId(x.cat))errors.push(`${X}: categoria com identificador inválido (${sh(x.cat)}).`);
      const k=ikey(x);if(seen.has(k))errors.push(`${I}: critério repetido (${sh(k)}).`);seen.add(k);
      if(x.st!==undefined&&x.st!==null&&!STATUS.includes(x.st))errors.push(`${X}: resultado inválido (${sh(x.st)}).`);
      for(const f of ['note','na','nv','d','tipo','inst','catName','en'])if(!strOpt(x[f]))errors.push(`${X}: o campo "${f}" deve ser texto.`);
      if(x.st=='NAO_CONFORME'&&!isObj(x.nc))warnings.push(`${X}: não conforme sem registro da ocorrência.`);
      if(x.nc!==undefined&&x.nc!==null){if(!isObj(x.nc))errors.push(`${X}: registro de ocorrência inválido.`);else{for(const f of ['desc','loc','pri','rec','obs'])if(!strOpt(x.nc[f]))errors.push(`${X}: ocorrência com campo "${f}" inválido.`);if(x.nc.pri&&!PRI_OK.includes(x.nc.pri))warnings.push(`${X}: prioridade desconhecida (${sh(x.nc.pri)}).`)}}
      if(!Array.isArray(x.ph)){errors.push(`${X}: lista de fotos inválida.`);continue}
      for(const f of x.ph){
        if(!okId(f)){errors.push(`${X}: identificador de foto inválido (${sh(f)}).`);continue}
        const p=phMap.get(f);
        if(p){if(p.ins!==i.id)errors.push(`${X}: foto ${sh(f)} pertence a outra vistoria (${sh(p.ins)}).`);(refBy.get(i.id)||refBy.set(i.id,new Set()).get(i.id)).add(f)}
        else if(local.photoIds.has(f)){if(local.photoIns.get(f)!==i.id)warnings.push(`${X}: foto ${sh(f)} existe localmente em outra vistoria.`)}
        else warnings.push(`${X}: referencia a foto ${sh(f)} que não existe; a referência será descartada na importação.`)}
    }
  }
  for(const p of d.photos){
    const P=`Foto ${sh(p.id)}`;
    if(typeof p.data!='string'||!IMG_RX.test(p.data))errors.push(`${P}: dados de imagem ausentes ou em formato inválido.`);
    else if(p.data.length*0.75>MAX_IMG)errors.push(`${P}: imagem excede o tamanho máximo permitido.`);
    if(!okId(p.ins))errors.push(`${P}: sem vínculo válido com uma vistoria.`);
    else if(!ids.insps.has(p.ins)&&!local.insps.some(i=>i.id==p.ins))errors.push(`${P}: vinculada a vistoria inexistente (${sh(p.ins)}).`);
    if(p.itemKey!==undefined&&typeof p.itemKey!='string')errors.push(`${P}: vínculo com critério inválido.`);
    const lo=local.photoIns.get(p.id);if(lo!==undefined&&lo!==p.ins)errors.push(`${P}: o mesmo identificador já existe neste aparelho em outra vistoria.`);
    if(ids.insps.has(p.ins)&&!(refBy.get(p.ins)&&refBy.get(p.ins).has(p.id)))warnings.push(`${P}: não está vinculada a nenhum critério (órfã); não será importada.`);
  }
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const cmp=(arr,localArr)=>{const m=new Map(localArr.map(r=>[r.id,r]));let nw=0,eq=0;const df=[];for(const r of arr){const o=m.get(r.id);if(!o)nw++;else if(same(o,r))eq++;else df.push(r.id)}return{nw,eq,df}};
  const ph={nw:0,eq:0,df:[]};
  for(const p of d.photos){if(!local.photoIds.has(p.id))ph.nw++;else if(fp&&fp.backup&&fp.local&&fpEq(fp.backup.get(p.id),fp.local.get(p.id)))ph.eq++;else ph.df.push(p.id)}
  return{errors,warnings,counts:{props:cmp(d.props,local.props),envs:cmp(envs,local.envs),insps:cmp(d.insps,local.insps),photos:ph},legacy};
}

/* Camada IndexedDB, registro único das vistorias em memória, fila de gravação,
   controle de versão (rev) contra edição em outra aba, diário de emergência e indicador de estado do salvamento. */
const DB=(()=>{let d;const o=()=>d||(d=new Promise((ok,er)=>{const r=indexedDB.open('vistoria',2);r.onupgradeneeded=()=>['props','insps','photos','envs'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}));
const t=async(s,m,f)=>{const db=await o();return new Promise((ok,er)=>{const x=db.transaction(s,m),q=f(x.objectStore(s));x.oncomplete=()=>ok(q&&q.result);x.onerror=()=>er(x.error);x.onabort=()=>er(x.error||new Error('Gravação abortada'))})};
// várias operações em UMA transação: ou grava tudo ou não grava nada (erro ao enfileirar => aborta tudo)
const multi=async ops=>{const db=await o();return new Promise((ok,er)=>{const x=db.transaction([...new Set(ops.map(z=>z[0]))],'readwrite');x.oncomplete=()=>ok();x.onerror=()=>er(x.error);x.onabort=()=>er(x.error||new Error('Transação abortada'));
  try{for(const [s,op,v] of ops)x.objectStore(s)[op](v)}catch(e){try{x.abort()}catch(_){}er(e)}})};
// grava a vistoria somente se a versão (rev) no banco for a que esta aba conhece; senão, houve edição em outra aba
const putRev=async ins=>{const db=await o();return new Promise((ok,er)=>{const x=db.transaction('insps','readwrite'),s=x.objectStore('insps'),g=s.get(ins.id);
  g.onsuccess=()=>{const c=g.result;if(!c){const e=new Error('Vistoria excluída em outra aba ou janela.');e.deleted=true;try{x.abort()}catch(_){}return er(e)}if((c.rev||0)!==(ins.rev||0)){const e=new Error('Vistoria alterada em outra aba ou janela.');e.conflict=true;try{x.abort()}catch(_){}return er(e)}
    const n=(ins.rev||0)+1;s.put(Object.assign({},ins,{rev:n}));x.oncomplete=()=>{ins.rev=n;ok()}};
  x.onerror=()=>er(x.error);x.onabort=()=>er(x.error||new Error('Transação abortada'))})};
// Exclusão em cascata em UMA transação (vistorias, fotos, ambientes, imóveis): tudo ou nada.
const cascade=async({propIds=[],insIds=[]})=>{const db=await o();return new Promise((ok,er)=>{const x=db.transaction(['props','envs','insps','photos'],'readwrite'),P=new Set(propIds),I=new Set(insIds),out={props:0,envs:0,insps:[],photos:[]};
  try{const ps=x.objectStore('insps'),cI=ps.openCursor();
   cI.onsuccess=()=>{const c=cI.result;if(c){if(P.has(c.value.pid)||I.has(c.key)){I.add(c.key);out.insps.push(c.key);c.delete()}c.continue();return}
    const cP=x.objectStore('photos').openCursor();cP.onsuccess=()=>{const q=cP.result;if(!q)return;if(I.has(q.value.ins)){out.photos.push(q.key);q.delete()}q.continue()}};
   const cE=x.objectStore('envs').openCursor();cE.onsuccess=()=>{const c=cE.result;if(!c)return;if(P.has(c.value.pid)){c.delete();out.envs++}c.continue()};
   propIds.forEach(id=>{x.objectStore('props').delete(id);out.props++})}catch(e){try{x.abort()}catch(_){}return er(e)}
  x.oncomplete=()=>ok(out);x.onerror=()=>er(x.error);x.onabort=()=>er(x.error||new Error('Transação abortada'))})};
return{cascade,all:s=>t(s,'readonly',x=>x.getAll()),keys:s=>t(s,'readonly',x=>x.getAllKeys()),get:(s,k)=>t(s,'readonly',x=>x.get(k)),put:(s,v)=>t(s,'readwrite',x=>x.put(v)),del:(s,k)=>t(s,'readwrite',x=>x.delete(k)),multi,putRev}})();
const toast=m=>{const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2200)};
const uid=()=>crypto.randomUUID();
// Registro único: existe UM objeto em memória por vistoria; toda edição acontece nele e é gravada a partir dele.
const GONE=new Set(),INS=new Map(),DIRTY=new Map(),UNSAVED=new Map(),FAILED=new Set(),CONFLICT=new Set();let CHAIN=Promise.resolve(),SAVE_ERR=false,INFLIGHT=0,RETRY=0,RECOVERED=0;
const banner=(id,on,text,top,btn,fn)=>{let e=document.getElementById(id);if(!e){e=document.createElement('div');e.id=id;e.style.cssText='position:fixed;left:0;right:0;z-index:20;background:#c0392b;color:#fff;padding:8px 12px;font-size:14px;text-align:center;top:'+top;e.appendChild(document.createTextNode(text+' '));if(btn){const b=document.createElement('button');b.textContent=btn;b.style.cssText='min-height:32px;padding:0 10px;margin-left:6px';b.onclick=fn;e.appendChild(b)}document.body.appendChild(e)}e.style.display=on?'block':'none'};
const warnSave=on=>banner('savewarn',on,'⚠ Erro ao salvar neste aparelho. Nova tentativa automática. Exporte um backup e não feche o app.','0','Tentar agora',()=>{FAILED.forEach(i=>DIRTY.set(i.id,i));flush()});
const warnConflict=()=>banner('conflictwarn',CONFLICT.size>0,'⚠ Esta vistoria foi alterada ou excluída em outra aba ou janela. Novas alterações NÃO estão sendo gravadas, para não sobrescrever as mais recentes.','36px','Recarregar',()=>location.reload());
// Indicador de estado — reflete o estado real da fila e do IndexedDB (só mostra "Salvo" com tudo confirmado)
function setSS(){const pend=DIRTY.size>0||!!save.t,st=SAVE_ERR?['Erro ao salvar','ss-err']:CONFLICT.size?['Conflito: recarregue','ss-err']:INFLIGHT?['Salvando…','ss-run']:pend?['Alterações pendentes','ss-run']:['Salvo','ss-ok'];document.querySelectorAll('#ss,.ssm').forEach(e=>{e.textContent=st[0];e.className=(e.id=='ss'?'s ':'s ssm ')+st[1]})}
const scheduleRetry=()=>{clearTimeout(RETRY);RETRY=setTimeout(()=>{FAILED.forEach(i=>DIRTY.set(i.id,i));flush()},4000)};
// gravações em fila (uma por vez, em ordem); o objeto é lido no momento da gravação, então vale sempre o estado mais recente
const persist=ins=>{INFLIGHT++;setSS();return CHAIN=CHAIN.then(()=>(CONFLICT.has(ins.id)||GONE.has(ins.id))?null:DB.putRev(ins)).then(()=>{INFLIGHT--;FAILED.delete(ins);if(!DIRTY.has(ins.id)&&!CONFLICT.has(ins.id))UNSAVED.delete(ins.id);if(!FAILED.size&&SAVE_ERR){SAVE_ERR=false;warnSave(false)}setSS()},err=>{INFLIGHT--;if(err&&(err.conflict||err.deleted)){CONFLICT.add(ins.id);warnConflict()}else{FAILED.add(ins);SAVE_ERR=true;warnSave(true);scheduleRetry()}setSS()})};
function flush(){clearTimeout(save.t);save.t=0;const l=[...DIRTY.values()];DIRTY.clear();const ps=l.map(persist);setSS();return Promise.all(ps).then(()=>CHAIN).then(()=>{if(l.length&&!SAVE_ERR&&!CONFLICT.size)toast('Salvo ✓');if(!UNSAVED.size&&!DIRTY.size&&!FAILED.size)walClear();setSS()})}
// now=true: grava já (escolhas e botões); false: pequena espera para agrupar digitação
function save(ins,now=false){if(!ins)return Promise.resolve();DIRTY.set(ins.id,ins);UNSAVED.set(ins.id,ins);clearTimeout(save.t);if(now){setSS();return flush()}save.t=setTimeout(flush,120);setSS();return Promise.resolve()}
// Diário de emergência: ao sair da página, grava de forma SÍNCRONA o que ainda não foi confirmado no IndexedDB.
// Na próxima abertura, se o banco ainda estiver na versão anterior, a edição é recuperada. Não substitui o IndexedDB.
const WAL='vistoria-wal';
const walWrite=()=>{if(!UNSAVED.size)return;try{localStorage.setItem(WAL,JSON.stringify([...UNSAVED.values()]))}catch(e){}};
const walClear=()=>{try{localStorage.removeItem(WAL)}catch(e){}};
async function walRecover(){let a=null;try{a=JSON.parse(localStorage.getItem(WAL)||'null')}catch(e){}if(!Array.isArray(a)||!a.length)return;let n=0;
  try{for(const j of a){if(!isObj(j)||!okId(j.id)||!Array.isArray(j.items))continue;const r=await DB.get('insps',j.id);if(!r||GONE.has(j.id)||(r.rev||0)!==(j.rev||0))continue;await DB.put('insps',Object.assign({},j,{rev:(j.rev||0)+1}));n++}walClear();RECOVERED=n}catch(e){}}
// outra aba pode ter gravado versão mais nova: detecta ao voltar para a aplicação
async function checkStale(){if(INFLIGHT||DIRTY.size)return;try{const all=await DB.all('insps'),ids=new Set(all.map(r=>r.id));for(const r of all){const m=INS.get(r.id);if(m&&(r.rev||0)>(m.rev||0))CONFLICT.add(r.id)}for(const id of INS.keys())if(!ids.has(id)&&!GONE.has(id))CONFLICT.add(id)}catch(e){}if(CONFLICT.size){warnConflict();setSS()}}

const walSync=()=>{if(UNSAVED.size)walWrite();else walClear()};

/* "Como inspecionar?": orientação exibida junto de cada critério durante a vistoria.
   Conteúdo derivado do método, dos instrumentos e dos avisos do catálogo; se o catálogo trouxer
   um procedimento próprio do critério (campo "procedure" ou "how_to"), ele é exibido em destaque. */
const OPEN={};
const HOW_METHOD={
 visual:['Visual','Observe com boa iluminação (lanterna, quando indicada) e de mais de um ângulo: acabamento, limpeza, integridade e continuidade do componente.'],
 funcional:['Funcional','Opere o componente em condições normais de uso, sem forçar, e observe funcionamento, folgas, travamentos e ruídos anormais.'],
 dimensional:['Dimensional','Meça com o instrumento indicado, anote o valor encontrado e compare com projeto ou memorial, se disponível. Não conclua atendimento a norma sem referência validada.'],
 documental:['Documental','Confira se o documento (projeto, memorial, manual ou outro) foi fornecido e se o que foi executado condiz com ele.']};
const rx=(s,r)=>r.test(s||'');
function howTo(x){
 const d=x.d||'',ins=x.inst||'',all=d+' '+ins,tp=(x.tipo||'').toLowerCase();
 const m=Object.keys(HOW_METHOD).filter(k=>tp.includes(k));
 const sf=['Inspeção ordinária é não destrutiva: não desmontar componentes, abrir quadros, perfurar nem remover revestimentos.'];
 if(rx(all,/água|torneira|chuveiro|descarga|vazamento|ralo|sifão|registro|hidr/i))sf.push('Teste com água só com abastecimento disponível, autorização e condições seguras. Se não for possível, marque "Não verificado" e registre o motivo.');
 if(rx(all,/tomada|interruptor|elétric|disjuntor|quadro|iluminação|luminária|testador|multímetro/i))sf.push('Elétrica: faça apenas verificação visual e funcional simples. Medições, abertura de quadros e manuseio de condutores são de profissional habilitado.');
 if(rx(all,/gás/i))sf.push('Gás: apenas verificação visual de identificação e acabamento. Teste de estanqueidade somente por procedimento específico e profissional habilitado.');
 return`<div class="how">
${x.proc?`<p><b>Procedimento do catálogo</b><br>${esc(x.proc)}</p>`:''}
<p><b>Método:</b> ${esc(x.tipo||'não informado')}</p>${m.map(k=>`<p><b>${HOW_METHOD[k][0]}.</b> ${HOW_METHOD[k][1]}</p>`).join('')}
<p><b>Instrumentos:</b> ${ins?esc(ins):'nenhum instrumento específico indicado'}</p>
<p><b>Cuidados</b></p><ul>${sf.map(s=>`<li>${s}</li>`).join('')}</ul>
<p><b>Como registrar</b></p><ul><li><b>Conforme:</b> item verificado e sem ocorrência; observações são opcionais.</li><li><b>Não conforme:</b> descreva a ocorrência, a localização exata e registre foto.</li><li><b>Não se aplica:</b> informe a justificativa.</li><li><b>Não verificado:</b> informe o motivo (por exemplo, sem água, sem energia ou acesso impedido).</li></ul>
<p class="mut">Nenhuma referência normativa está vinculada a este critério; as referências do catálogo estão pendentes de validação.</p>
<p class="mut">Orientação geral derivada do método e dos avisos do catálogo. Não é procedimento técnico específico deste critério nem substitui ensaios.</p></div>`}

/* Backup: exportação com assinatura das fotos, validação, importação atômica e verificação de integridade. */
const blobData=b=>new Promise((ok,er)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>er(f.error);f.readAsDataURL(b)});
async function fpBytes(u){let h;if(window.crypto&&crypto.subtle){try{h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',u))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}}
  if(!h){let x=2166136261;for(let i=0;i<u.length;i++){x^=u[i];x=Math.imul(x,16777619)>>>0}h='fnv'+x.toString(16)}return u.length+':'+h}
const fpBlob=async b=>fpBytes(new Uint8Array(await b.arrayBuffer()));
const dataBytes=s=>{const b=atob(s.slice(s.indexOf(',')+1)),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const MAGIC={'image/jpeg':[[0xFF,0xD8,0xFF]],'image/png':[[0x89,0x50,0x4E,0x47]],'image/gif':[[0x47,0x49,0x46,0x38]],'image/webp':[[0x52,0x49,0x46,0x46]]};
const magicOk=(mime,u)=>(MAGIC[mime]||[]).some(m=>m.every((b,i)=>u[i]===b));
async function buildBackup(){await flush();const [p,e,ph]=await Promise.all([DB.all('props'),DB.all('envs'),DB.all('photos')]),out=[];
  for(const x of ph){const q={...x,data:await blobData(x.blob),fp:await fpBlob(x.blob)};delete q.blob;out.push(q)}
  const i=[...INS.values()];return{app:BACKUP_APP,formatVersion:BACKUP_FORMAT,exportedAt:new Date().toISOString(),counts:{props:p.length,envs:e.length,insps:i.length,photos:out.length},props:p,envs:e,insps:i,photos:out}}
function download(o,name){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));l.download=name;l.click()}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
// Verificação de integridade entre os object stores (usada após importações)
async function integrityScan(){const [p,e,ph]=await Promise.all([DB.all('props'),DB.all('envs'),DB.all('photos')]),ins=[...INS.values()];
  const pid=new Set(p.map(x=>x.id)),phIds=new Set(ph.map(x=>x.id)),refd=new Set(),dangling=[];
  for(const i of ins)for(const x of i.items||[])for(const f of x.ph||[]){refd.add(f);if(!phIds.has(f))dangling.push(i.id+'|'+ikey(x)+'|'+f)}
  return{orphanPhotos:ph.filter(x=>!refd.has(x.id)).map(x=>x.id),danglingRefs:dangling,envsSemImovel:e.filter(x=>!pid.has(x.pid)).map(x=>x.id),vistoriasSemImovel:ins.filter(i=>!pid.has(i.pid)&&!i.prop).map(i=>i.id),fotosSemVistoria:ph.filter(x=>!INS.has(x.ins)).map(x=>x.id)}}
const REJ='Backup REJEITADO. Nenhum dado foi alterado.\n\n';
async function importBackup(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){return alert('Backup REJEITADO: o arquivo não é um JSON legível.\nNenhum dado foi alterado.')}
  await flush();
  const [lp,le,lph]=await Promise.all([DB.all('props'),DB.all('envs'),DB.all('photos')]);
  const local={props:lp,envs:le,insps:[...INS.values()],photoIds:new Set(lph.map(x=>x.id)),photoIns:new Map(lph.map(x=>[x.id,x.ins]))};
  let v=validateBackup(d,local);
  if(v.errors.length)return alert(REJ+'Problemas encontrados ('+v.errors.length+'):\n'+fmtList(v.errors,10));
  // assinatura e conteúdo real das imagens
  const fpB=new Map(),fpL=new Map(),bad=[];
  try{for(const p of d.photos){const u=dataBytes(p.data),mime=p.data.slice(5,p.data.indexOf(';'));if(!u.length||!magicOk(mime,u)){bad.push(`Foto ${p.id}: o conteúdo não é uma imagem ${mime} válida.`);continue}
    const f=await fpBytes(u);fpB.set(p.id,f);if(p.fp&&!fpEq(p.fp,f))bad.push(`Foto ${p.id}: o conteúdo não corresponde à assinatura gravada no backup (arquivo corrompido).`)}}catch(e){bad.push('Dados de imagem ilegíveis: '+(e&&e.message||e))}
  if(bad.length)return alert(REJ+'Problemas encontrados ('+bad.length+'):\n'+fmtList(bad,10));
  for(const x of lph)if(fpB.has(x.id))fpL.set(x.id,await fpBlob(x.blob));
  v=validateBackup(d,local,{backup:fpB,local:fpL});
  const c=v.counts,nConf=c.props.df.length+c.envs.df.length+c.insps.df.length+c.photos.df.length,nNew=c.props.nw+c.envs.nw+c.insps.nw+c.photos.nw;
  let msg=`Backup válido.\nNovos: ${c.props.nw} imóvel(is), ${c.envs.nw} ambiente(s), ${c.insps.nw} vistoria(s), ${c.photos.nw} foto(s).\nJá existentes e idênticos (ignorados): ${c.props.eq+c.envs.eq+c.insps.eq+c.photos.eq}.\nJá existentes e DIFERENTES: ${nConf} (por padrão, os dados atuais são mantidos).`;
  if(v.warnings.length)msg+='\n\nAvisos ('+v.warnings.length+'):\n'+fmtList(v.warnings,5);
  if(!nNew&&!nConf)return alert('Nada a importar: todos os registros do backup já existem e são idênticos.');
  if(!confirm(msg+(nNew?'\n\nImportar os registros novos?':'\n\nNão há registros novos; só conflitos. Continuar?')))return;
  let rep=false;
  if(nConf&&confirm(`${nConf} registro(s) já existem com conteúdo diferente.\n\nOK = SUBSTITUIR pelos do backup (um backup do estado atual será baixado antes).\nCancelar = MANTER os dados atuais.`)){rep=true;download(await buildBackup(),`backup-antes-da-importacao-${stamp()}.json`)}
  try{
    const have=a=>new Set(a.map(r=>r.id)),pick=(arr,df,h)=>arr.filter(r=>!h.has(r.id)||(rep&&df.includes(r.id)));
    const P=pick(d.props,c.props.df,have(lp)),E=pick(d.envs||[],c.envs.df,have(le)),I0=pick(d.insps,c.insps.df,have(local.insps));
    // cópia das vistorias a importar: descarta referências a fotos inexistentes e preserva a numeração de versão
    const bph=new Set(d.photos.map(p=>p.id));let stripped=0;
    const I=I0.map(r=>{const q=JSON.parse(JSON.stringify(r)),lo=INS.get(q.id);for(const x of q.items){const k=[];for(const f of x.ph){if(bph.has(f)||local.photoIds.has(f))k.push(f);else stripped++}x.ph=[...new Set(k)]}q.rev=lo?(lo.rev||0)+1:(q.rev||0);return q});
    const refs=new Set(I.flatMap(q=>q.items.flatMap(x=>x.ph))),photos=[];let orph=0;
    for(const p of d.photos){if(!refs.has(p.id)){orph++;continue}
      if(!local.photoIds.has(p.id)||(rep&&c.photos.df.includes(p.id))){const b=await (await fetch(p.data)).blob();if(!b.size||!b.type.startsWith('image/'))throw new Error('Foto '+p.id+' ilegível.');const q={...p,blob:b};delete q.data;delete q.fp;photos.push(q)}}
    // fotos antigas de vistorias substituídas que não estão mais vinculadas
    const dels=lph.filter(x=>INS.has(x.ins)&&I.some(q=>q.id==x.ins)&&!refs.has(x.id)).map(x=>x.id);
    if(!P.length&&!E.length&&!I.length&&!photos.length&&!dels.length){toast('Nada foi importado; os dados atuais foram mantidos.');return}
    await DB.multi([...P.map(r=>['props','put',r]),...E.map(r=>['envs','put',r]),...I.map(r=>['insps','put',r]),...photos.map(r=>['photos','put',r]),...dels.map(id=>['photos','delete',id])]); // atômico
    for(const r of I){INS.set(r.id,r);UNSAVED.delete(r.id);DIRTY.delete(r.id);if(cur&&cur.id==r.id)cur=r;PL.delete(r.id)}
    for(const p of photos)delete urls[p.id];for(const id of dels)delete urls[id];
    await load();const sc=await integrityScan(),bad2=Object.entries(sc).filter(z=>z[1].length);
    go('dash');
    const extra=[stripped?`${stripped} referência(s) a foto inexistente descartada(s)`:'',orph?`${orph} foto(s) órfã(s) do arquivo ignorada(s)`:'',dels.length?`${dels.length} foto(s) antiga(s) sem vínculo removida(s)`:''].filter(Boolean);
    toast(`Importado: ${P.length} imóvel(is), ${E.length} ambiente(s), ${I.length} vistoria(s), ${photos.length} foto(s)`);
    if(extra.length||bad2.length)alert('Importação concluída.\n'+extra.join('\n')+(bad2.length?'\n\nVerificação de integridade — itens a revisar:\n'+bad2.map(z=>`• ${z[0]}: ${z[1].length}`).join('\n'):''))
  }catch(e){alert('A importação FALHOU e nenhum dado foi alterado.\n'+(e&&e.message||e))}}

/* Exclusão de vistorias e de cadastros de imóveis: confirmação, transação única e limpeza de estados.
   Nada é apagado fora de uma única transação do IndexedDB (tudo ou nada). */
const nPh=i=>i.items.reduce((n,x)=>n+x.ph.length,0);
async function removeData({propIds=[],insIds=[]}){
  // 1) antes de apagar: impede que o salvamento automático, a nova tentativa e o diário recriem estas vistorias
  const will=[...INS.values()].filter(i=>insIds.includes(i.id)||propIds.includes(i.pid)).map(i=>i.id);
  will.forEach(id=>{GONE.add(id);DIRTY.delete(id);UNSAVED.delete(id);CONFLICT.delete(id);for(const f of [...FAILED])if(f.id==id)FAILED.delete(f)});
  clearTimeout(save.t);save.t=DIRTY.size?setTimeout(flush,120):0;walSync();setSS();
  try{
    await CHAIN; // termina a gravação que já estava em andamento
    const out=await DB.cascade({propIds,insIds}); // 2) exclusão atômica
    for(const id of out.insps){GONE.add(id);INS.delete(id);DIRTY.delete(id);UNSAVED.delete(id);CONFLICT.delete(id);PL.delete(id);for(const f of [...FAILED])if(f.id==id)FAILED.delete(f);Object.keys(OPEN).forEach(k=>{if(k.startsWith(id+':'))delete OPEN[k]});if(cur&&cur.id==id)cur=null}
    for(const pid of out.photos){if(urls[pid]){try{URL.revokeObjectURL(urls[pid])}catch(e){}delete urls[pid]}}
    walSync();setSS();if(!UNSAVED.size&&!FAILED.size&&SAVE_ERR){SAVE_ERR=false;warnSave(false)}warnConflict();
    return out;
  }catch(e){ // falhou: nada foi apagado; as vistorias voltam a ser salvas normalmente
    will.forEach(id=>{GONE.delete(id);const m=INS.get(id);if(m){DIRTY.set(id,m);UNSAVED.set(id,m)}});if(DIRTY.size)flush();setSS();throw e}}
async function runDelete(opts,msg){
  try{const out=await removeData(opts);await load();const pids=opts.propIds||[];
    if(['insp','review','rel'].includes(S.v)&&!cur)go('insps');
    else if(['envs','env','start'].includes(S.v)&&pids.includes(S.pid))go('props');
    else if(S.v=='prop'&&S.p&&pids.includes(S.p.id))go('props');
    else render();
    toast(msg(out))}
  catch(e){alert('A exclusão FALHOU e nenhum dado foi alterado.\n'+(e&&e.message||e));render()}}
async function deleteInspection(id){await flush();const i=INS.get(id);if(!i)return;const c=cnt(i);

  const all=(await DB.all('insps')).filter(i=>i.pid==id).map(r=>INS.get(r.id)||r),ne=envs.filter(e=>e.pid==id).length,ph=all.reduce((n,i)=>n+nPh(i),0),nm=(p.name||'Sem nome')+(p.unit?' · un. '+p.unit:'');
